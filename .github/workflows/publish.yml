name: Publish Python package

on:
  release:
    types: [ published ]

permissions: {}

env:
  PYTHON_VERSION: "3.14"

jobs:
  build-sdist:
    name: Build sdist

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Build PyPI package
        run: uv build --sdist

      - name: Upload artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artefacts-sdist
          path: ./dist/quart_assets-*.tar.gz

  build-wheels:
    name: Build wheels on ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false

      - name: Build PyPI package
        run: uv build --wheel

      - name: Upload artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artefacts-wheel-${{ matrix.os }}
          path: ./dist/quart_assets-*.whl

  publish-test-pypi:
    name: Publish TestPyPI package

    needs:
      - build-sdist
      - build-wheels

    runs-on: ubuntu-latest

    env:
      PUBLISH_REGISTRY: https://test.pypi.org/legacy/

    environment:
      name: testpypi
      url: https://test.pypi.org/p/quart-assets

    permissions:
      contents: read
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write

    steps:
      - name: Download artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artefacts-*
          path: dist
          merge-multiple: true

      - name: Publish PyPI package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ env.PUBLISH_REGISTRY }}

  publish-pypi:
    name: Publish PyPI package

    needs:
      - build-sdist
      - build-wheels

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/quart-assets

    permissions:
      contents: read
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write

    steps:
      - name: Download artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artefacts-*
          path: dist
          merge-multiple: true

      - name: Publish PyPI package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
