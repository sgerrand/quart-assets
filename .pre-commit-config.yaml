default_language_version:
  python: python3.15

default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --frozen --group dev ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^(src/|tests/)
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --group dev ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^(src/|tests/)
        require_serial: true

      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
        stages: [pre-commit]

      - id: ty
        name: ty
        entry: uv run --frozen --group dev ty check
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, build, chore, ci, docs, feat, fix, perf, refactor, style, test]
